<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="Meala Logo" width="32" height="32" />
      <span class="brand-title">Meala</span>
      <span class="brand-tag">v1.0</span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle Navigation">☰</button>

    <nav class="site-nav" id="siteNav">
      {% for item in site.data.navigation.main %}
        <a href="{% if item.external %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"
           {% if item.external %}target="_blank" rel="noopener"{% endif %}
           class="nav-link">
          {{ item.title }}
        </a>
      {% endfor %}
      <a href="{{ '/docs/self-hosted/' | relative_url }}" class="btn btn-primary btn-sm">Deploy Server</a>
    </nav>
  </div>
</header>
